name: elfinic_commerce_llc
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.1+2

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_signin_button: ^2.1.1
  icons_plus: ^5.0.0
  intl_phone_field: ^3.2.0
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.1.1
  flutter_countdown_timer: ^4.1.0
  video_player: ^2.10.0
  smooth_page_indicator: ^1.2.1
  readmore: ^3.0.0
  auto_size_text: ^3.0.0
  line_icons: ^2.0.3
  google_fonts: ^6.3.0
  google_nav_bar: ^5.0.7
  shimmer_animation: ^2.2.2
  http: ^1.5.0
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  shared_preferences: ^2.5.3
  cached_network_image: ^3.4.1
  collection: ^1.19.0
  curved_navigation_bar: ^1.0.6
  lottie: ^3.3.1
  razorpay_flutter: ^1.4.0
  flutter_dotenv: ^6.0.0
  flutter_add_to_cart_button: ^1.2.0
  html: ^0.15.6
  connectivity_plus: ^6.0.3
  equatable: ^2.0.7
  custom_rating_bar: ^3.0.0
  flutter_svg: ^2.2.0
  loading_animation_widget: ^1.3.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.3.0
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.2
  video_compress: ^3.1.2
  photo_view: ^0.15.0
  async: ^2.11.0
  photo_manager: ^3.8.3
  photo_manager_image_provider: ^2.1.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/icons/app_Icon_512.png"
    remove_alpha_ios: true
    min_sdk_android: 21

    web:
      generate: true
      image_path: "assets/images/logo.jpeg"
      background_color: "#hexcode"
      theme_color: "#hexcode"

    windows:
      generate: true
      image_path: "assets/images/logo.jpeg"
      icon_size: 48

    macos:
      generate: true
      image_path: "assets/images/logo.jpeg"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/animations/
    - assets/videos/
    - assets/fonts/NotoSans-Regular.ttf

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
